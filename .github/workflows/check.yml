name: Check Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    env:
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      GH_ENTERPRISE_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate CLI credentials
        run: |
          mkdir -p "$RUNNER_TEMP/gardener-no-auth"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/gardener-no-auth" >> "$GITHUB_ENV"
      - name: Offline unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Offline analysis smoke test
        run: >-
          python -B scripts/github_gardener.py analyze
          --snapshot tests/fixtures/snapshot-v2.json
          --config tests/fixtures/context.json
          --format both --output "$RUNNER_TEMP/gardener-report"
      - name: Package Skill
        run: python -B scripts/package_skill.py --output "$RUNNER_TEMP/github-gardener.skill"
